<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <script src="../js/formulario.js"></script>
    <link rel="stylesheet" href="../css/formulario.css">
    
</head>

<body>
    <div class="container">
        <header>Universidad Central del Ecuador</header>
        <div class="formulario">
            <nav></nav>
            <section>
                <form action="">
                    <h2>Nuevo Estudiante</h2>
                    <div id="id_msg_error" class="msg_error"></div>
                    <p type="Nombre:">
                    <div class="llenar_formulario">
                        <input id="id_nombre" type="text"><span id="id_error_nombre" class="error_asterisco"></span>
                    </div>
                    </p>
                    <p type="Apellido:">
                    <div class="llenar_formulario">
                        <input id="id_apellido" type="text"><span id="id_error_apellido" class="error_asterisco"></span>
                    </div>
                    </p>
                    <p type="Fecha de Nacimiento:">
                    <div class="llenar_formulario">
                        <input id="id_date" type="date"><span id="id_error_date" class="error_asterisco"></span>
                    </div>
                    </p>
                    <p type="Email:">
                    <div class="llenar_formulario">
                        <input id="id_email" type="email"><span id="id_error_email" class="error_asterisco"></span>
                    </div>
                    </p>
                    <p type="Password:">
                    <div class="llenar_formulario">
                        <input id="id_password" type="password"><span id="id_error_password" class="error_asterisco"></span>
                    </div>
                    </p>
                    <div class="centrar_boton">
                        <button onclick="guardar()">Guardar</button>
                    </div>
                </form>
            </section>
        </div>
        <footer>Todos los derechos reservados</footer>
    </div>
</body>

</html>
